<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Knowledge Assistant</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  {% verbatim %}
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const csrf = () => (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || "";

    async function api(path, opts = {}) {
      const headers = { "X-CSRFToken": csrf() };
      if (typeof opts.body === "string") headers["Content-Type"] = "application/json";
      const res = await fetch(path, { credentials: "same-origin", ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      return data;
    }

    function App() {
      const [docs, setDocs] = useState([]);
      const [active, setActive] = useState("");
      const [msgs, setMsgs] = useState([]);
      const [q, setQ] = useState("");
      const [busy, setBusy] = useState("");
      const [error, setError] = useState("");
      const endRef = useRef(null);

      const load = () => api("/api/documents/").then(d => setDocs(d.documents)).catch(e => setError(e.message));
      useEffect(() => { load(); }, []);
      useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);

      const run = async (label, fn) => {
        setBusy(label); setError("");
        try { await fn(); } catch (e) { setError(e.message); }
        setBusy("");
      };

      const upload = (file) => run("Reading and indexing document…", async () => {
        const body = new FormData(); body.append("file", file);
        await api("/api/documents/", { method: "POST", body });
        await load();
      });

      const remove = (id) => run("Deleting…", async () => {
        await api(`/api/documents/${id}/`, { method: "DELETE" });
        if (String(id) === active) setActive("");
        await load();
      });

      const ask = () => {
        const question = q.trim();
        if (!question) return;
        setQ(""); setMsgs(m => [...m, { role: "user", text: question }]);
        run("Thinking…", async () => {
          const d = await api("/api/ask/", { method: "POST", body: JSON.stringify({ question, document_id: active || null }) });
          setMsgs(m => [...m, { role: "ai", text: d.answer, sources: d.sources }]);
        });
      };

      const summarize = () => run("Summarizing…", async () => {
        const d = await api("/api/summarize/", { method: "POST", body: JSON.stringify({ document_id: active }) });
        setMsgs(m => [...m, { role: "ai", text: d.summary }]);
      });

      return (
        <div className="mx-auto flex h-screen max-w-6xl flex-col p-4">
          <header className="mb-3">
            <h1 className="text-2xl font-bold">AI Knowledge Assistant</h1>
            <p className="text-sm text-slate-500">Upload PDF/TXT/MD files, then ask questions or get a summary. Don't upload confidential files: the free AI tier may use content to improve its products.</p>
          </header>

          <div className="grid flex-1 grid-cols-1 gap-4 overflow-hidden md:grid-cols-3">
            <aside className="overflow-y-auto rounded-xl border bg-white p-4">
              <label className="mb-3 block cursor-pointer rounded-lg border-2 border-dashed p-4 text-center text-sm text-slate-500 hover:bg-slate-50">
                + Upload document (max 5 MB)
                <input type="file" accept=".pdf,.txt,.md" className="hidden" disabled={!!busy}
                       onChange={e => { if (e.target.files[0]) upload(e.target.files[0]); e.target.value = ""; }} />
              </label>
              <button onClick={() => setActive("")}
                      className={"mb-2 w-full rounded-lg px-3 py-2 text-left text-sm " + (active === "" ? "bg-indigo-600 text-white" : "bg-slate-100")}>
                All documents
              </button>
              {docs.map(d => (
                <div key={d.id} className={"mb-2 flex items-center justify-between rounded-lg px-3 py-2 text-sm " + (active === String(d.id) ? "bg-indigo-600 text-white" : "bg-slate-100")}>
                  <button className="flex-1 truncate text-left" onClick={() => setActive(String(d.id))}>{d.title}</button>
                  <button className="ml-2 opacity-70 hover:opacity-100" onClick={() => remove(d.id)} title="Delete">✕</button>
                </div>
              ))}
              {active && <button onClick={summarize} disabled={!!busy} className="mt-2 w-full rounded-lg border border-indigo-600 px-3 py-2 text-sm text-indigo-600 hover:bg-indigo-50 disabled:opacity-50">Summarize selected document</button>}
            </aside>

            <main className="flex flex-col overflow-hidden rounded-xl border bg-white md:col-span-2">
              <div className="flex-1 space-y-3 overflow-y-auto p-4">
                {msgs.length === 0 && <p className="text-sm text-slate-400">Upload a document, then ask a question about it.</p>}
                {msgs.map((m, i) => (
                  <div key={i} className={m.role === "user" ? "text-right" : ""}>
                    <div className={"inline-block max-w-[90%] whitespace-pre-wrap rounded-2xl px-4 py-2 text-left text-sm " + (m.role === "user" ? "bg-indigo-600 text-white" : "bg-slate-100")}>{m.text}</div>
                    {m.sources && m.sources.length > 0 && (
                      <details className="mt-1 text-xs text-slate-500">
                        <summary className="cursor-pointer">Sources ({m.sources.length})</summary>
                        {m.sources.map((s, j) => <p key={j} className="mt-1"><b>[{j + 1}] {s.document}</b>: {s.text}…</p>)}
                      </details>
                    )}
                  </div>
                ))}
                {busy && <p className="text-sm text-slate-400">{busy}</p>}
                {error && <p className="rounded-lg bg-red-50 p-3 text-sm text-red-700">{error}</p>}
                <div ref={endRef} />
              </div>
              <div className="flex gap-2 border-t p-3">
                <input value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === "Enter" && !busy && ask()}
                       placeholder="Ask a question about your documents…" maxLength={1000}
                       className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-300" />
                <button onClick={ask} disabled={!!busy || !q.trim()} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm text-white disabled:opacity-50">Ask</button>
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  {% endverbatim %}
</body>
</html>
